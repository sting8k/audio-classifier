# Builds the app with its bundled assets (SPEC D-6) for each target and publishes a GitHub prerelease.
# Run: push a tag "v*" or "dev-*", or start it by hand (workflow_dispatch) with a tag name.
name: release

on:
  push:
    tags: ["v*", "dev-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. dev-20261019)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, plat: linux-amd64, tags: "-tags webkit2_41" }
          - { os: windows-2022, plat: windows-amd64, tags: "" }
          - { os: macos-14, plat: darwin-arm64, tags: "" }
          - { os: macos-15-intel, plat: darwin-amd64, tags: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Fetch pinned assets
        run: scripts/fetch-assets.sh ${{ matrix.plat }}
      - name: Build
        run: wails build -clean ${{ matrix.tags }}
      - name: Package
        run: |
          set -euo pipefail
          name=AudioLangClassifier-$TAG-${{ matrix.plat }}
          mkdir -p dist-pkg
          case "${{ matrix.plat }}" in
            darwin-*)
              app=$(ls -d build/bin/*.app)
              mkdir -p "$app/Contents/MacOS/third_party"
              cp -R third_party/${{ matrix.plat }} "$app/Contents/MacOS/third_party/"
              # Adding files breaks the bundle's ad-hoc seal; re-sign ad-hoc (no Apple account, D-9).
              codesign --force --deep -s - "$app"
              ditto -c -k --keepParent "$app" dist-pkg/$name.zip ;;
            windows-*)
              mkdir -p "pkg/$name/third_party"
              cp build/bin/AudioLangClassifier.exe "pkg/$name/"
              cp -R third_party/${{ matrix.plat }} "pkg/$name/third_party/"
              (cd pkg && 7z a -tzip ../dist-pkg/$name.zip "$name" >/dev/null) ;;
            linux-*)
              mkdir -p "pkg/$name/third_party"
              cp build/bin/AudioLangClassifier "pkg/$name/"
              cp -R third_party/${{ matrix.plat }} "pkg/$name/third_party/"
              tar -C pkg -czf dist-pkg/$name.tar.gz "$name" ;;
          esac
          ls -lh dist-pkg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plat }}
          path: dist-pkg/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release (dev-* tags are prereleases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; title="$TAG"
          case "$TAG" in dev-*) pre="--prerelease"; title="$TAG (dev build)" ;; esac
          cat > notes.md <<'EOF'
          Unzip and run; ffmpeg, onnxruntime and the models are bundled, no internet needed.

          - **macOS (Apple Silicon: darwin-arm64, Intel: darwin-amd64)**: the app is not signed. Once, run `xattr -cr "Audio Language Classifier.app"`, then open it.
          - **Windows (64-bit)**: keep the `third_party` folder next to `AudioLangClassifier.exe`. Needs the WebView2 runtime (built into Windows 11).
          - **Linux (x86-64)**: needs `libwebkit2gtk-4.1`.

          Bundled third-party software (licence texts in `third_party/<platform>/licenses`):
          onnxruntime 1.23.2 (MIT), Silero VAD v6.2.3 (MIT),
          Ear 0.2.1 by Desert Ant Labs (Desert Ant Labs Source-Available License 1.0, https://license.desertant.com/1.0),
          ffmpeg 9.0.2: LGPL v3 build on Windows/Linux, GPL v3 build on macOS.
          ffmpeg source: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            $pre --title "$title" --notes-file notes.md
